<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רשימות תפוצה | WHITEBOARD דיוור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#253E7A; --navy-dark:#1a2e5e; --cyan:#38C4F2; --cyan-dark:#1db0d8;
    --pink:#F05680; --green:#22c55e; --amber:#F59E0B;
    --bg:#EBF3FB; --surface:#FFFFFF; --surface-2:#F4F9FF; --surface-3:#edf4ff;
    --border:rgba(37,62,122,0.1); --border-mid:rgba(37,62,122,0.18);
    --text-main:#1a2f5e; --text-sub:rgba(37,62,122,0.62); --text-xs:rgba(37,62,122,0.4);
    --font:'Heebo',sans-serif; --font-brand:'Fredoka',sans-serif;
    --r-sm:10px; --r-md:14px; --r-lg:20px;
    --sh-sm:0 2px 8px rgba(37,62,122,0.08); --sh-md:0 8px 30px rgba(37,62,122,0.12);
    --rail:288px;
  }
  [data-theme="dark"]{
    --bg:#0c1422; --surface:#131e35; --surface-2:#192740; --surface-3:#1e2e48;
    --border:rgba(255,255,255,0.08); --border-mid:rgba(255,255,255,0.14);
    --text-main:#dde5f5; --text-sub:rgba(221,229,245,0.62); --text-xs:rgba(221,229,245,0.36);
    --sh-sm:0 2px 10px rgba(0,0,0,0.3); --sh-md:0 8px 32px rgba(0,0,0,0.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--text-main);height:100dvh;overflow:hidden;display:flex;transition:background .3s,color .3s;}
  svg{display:block;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:8px;}

  /* ============ GLOBAL SECTION SIDEBAR (teacher) ============ */
  .side{width:220px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:16px 12px;}
  [data-theme="dark"] .side{background:#0e1830;border-inline-start:1px solid rgba(255,255,255,.05);}
  .side .logo{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;}
  .side .logo .mark{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .side .logo .mark svg{width:22px;height:22px;}
  .side .logo b{font-family:var(--font-brand);font-weight:700;font-size:16px;letter-spacing:.3px;}
  .side .logo b span{color:var(--cyan);}
  .side .grp{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.4);padding:14px 10px 6px;letter-spacing:.4px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:rgba(255,255,255,.72);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:.15s;}
  .nav a svg{width:17px;height:17px;flex-shrink:0;}
  .nav a:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav a.active{background:rgba(56,196,242,.16);color:var(--cyan);font-weight:700;}
  .side .spacer{flex:1;}
  .side .me{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:var(--r-sm);cursor:pointer;transition:.15s;}
  .side .me:hover{background:rgba(255,255,255,.07);}
  .side .me .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
  .side .me .who{min-width:0;} .side .me .who b{font-size:12.5px;display:block;} .side .me .who span{font-size:10.5px;color:rgba(255,255,255,.5);}

  /* ============ MAIN COLUMN ============ */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:var(--sh-sm);z-index:5;}
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-sub);}
  .crumb b{color:var(--text-main);font-weight:700;} .crumb svg{width:15px;height:15px;color:var(--text-xs);}
  .top-actions{display:flex;align-items:center;gap:8px;}
  .iconbtn{width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-sub);cursor:pointer;transition:.15s;}
  .iconbtn:hover{border-color:var(--border-mid);color:var(--text-main);}
  .iconbtn svg{width:19px;height:19px;} .icon-sun{display:none;} [data-theme="dark"] .icon-sun{display:block;} [data-theme="dark"] .icon-moon{display:none;}

  .workspace{flex:1;min-height:0;display:flex;}

  /* ============ RIGHT RAIL — MY LISTS ============ */
  .rail{width:var(--rail);flex-shrink:0;background:var(--surface);border-inline-start:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  .rail-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);}
  .rail-head .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
  .rail-head h2{font-family:var(--font-brand);font-weight:700;font-size:16px;}
  .rail-head .sub{font-size:11.5px;color:var(--text-xs);}
  .btn-new{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:none;border-radius:var(--r-sm);padding:8px 12px;font-family:var(--font);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;}
  .btn-new:hover{background:var(--navy-dark);} .btn-new svg{width:14px;height:14px;}
  [data-theme="dark"] .btn-new{background:var(--cyan);color:#06263a;} [data-theme="dark"] .btn-new:hover{background:var(--cyan-dark);}
  .search{position:relative;margin-top:12px;}
  .search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-xs);pointer-events:none;}
  .search input{width:100%;padding:8px 34px 8px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--font);font-size:12.5px;color:var(--text-main);}
  .search input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,196,242,.12);}

  .rail-list{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;}
  .rail-grp{font-size:10.5px;font-weight:700;color:var(--text-xs);padding:11px 8px 4px;letter-spacing:.2px;}
  .autob{font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:rgba(56,196,242,.14);color:var(--cyan);margin-inline-start:6px;font-family:var(--font);vertical-align:middle;}
  .lst{display:flex;gap:10px;padding:11px 11px;border-radius:var(--r-md);cursor:pointer;border:1px solid transparent;transition:.15s;position:relative;text-align:start;}
  .lst:hover{background:var(--surface-2);}
  .lst.sel{background:var(--surface-3);border-color:var(--border-mid);}
  .lst.sel::before{content:'';position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--cyan);}
  .lst .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.18);}
  .dot.draft{background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.16);}
  .dot.paused{background:var(--text-xs);}
  .lst .body{min-width:0;flex:1;}
  .lst .nm{font-size:13.5px;font-weight:600;line-height:1.32;color:var(--text-main);font-family:var(--font-brand);}
  .lst.sel .nm{color:var(--text-main);}
  .lst .meta{font-size:11px;color:var(--text-sub);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .lst .meta .n{font-weight:700;color:var(--text-main);}
  .lst .meta .sep{width:3px;height:3px;border-radius:50%;background:var(--text-xs);}

  .quota{padding:12px 16px 14px;border-top:1px solid var(--border);}
  .quota .qt{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--text-sub);margin-bottom:6px;}
  .quota .qt b{color:var(--text-main);font-weight:700;font-size:12px;}
  .quota .bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;}
  .quota .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--cyan-dark));}
  .quota .qhint{font-size:10px;color:var(--text-xs);margin-top:6px;}

  /* ============ CONTENT PANEL ============ */
  .content{flex:1;min-width:0;min-height:0;overflow-y:auto;padding:22px 26px 40px;}
  .cwrap{max-width:900px;margin:0 auto;}

  /* list header */
  .lhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .lhead .titles{min-width:0;}
  .lhead h1{font-family:var(--font-brand);font-weight:700;font-size:23px;line-height:1.18;display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:var(--font);}
  .pill .pd{width:7px;height:7px;border-radius:50%;}
  .pill.live{color:var(--green);background:rgba(34,197,94,.12);} .pill.live .pd{background:var(--green);}
  .pill.draft{color:var(--amber);background:rgba(245,158,11,.13);} .pill.draft .pd{background:var(--amber);}
  .pill.paused{color:var(--text-sub);background:var(--surface-3);} .pill.paused .pd{background:var(--text-xs);}
  .lhead .desc{font-size:13px;color:var(--text-sub);margin-top:6px;}
  .lhead .acts{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:22px;font-family:var(--font);font-size:13px;font-weight:700;border:none;cursor:pointer;transition:.18s;white-space:nowrap;} .btn svg{width:15px;height:15px;}
  .btn-primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-dark));color:#fff;box-shadow:0 4px 15px rgba(56,196,242,.32);} .btn-primary:hover{transform:translateY(-1px);}
  .btn-ghost{background:var(--surface);color:var(--navy);border:1.5px solid var(--border-mid);} [data-theme="dark"] .btn-ghost{color:var(--text-main);} .btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn-icon{width:38px;height:38px;padding:0;justify-content:center;border-radius:var(--r-sm);background:var(--surface);border:1.5px solid var(--border-mid);color:var(--text-sub);}
  .btn-icon:hover{color:var(--text-main);border-color:var(--cyan);}

  /* dropdown menu */
  .menu-wrap{position:relative;}
  .menu{position:absolute;inset-inline-end:0;top:44px;background:var(--surface);border:1px solid var(--border-mid);border-radius:var(--r-md);box-shadow:var(--sh-md);padding:6px;min-width:200px;z-index:20;display:none;}
  .menu.open{display:block;animation:pop .16s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:none;font-family:var(--font);font-size:13px;font-weight:600;color:var(--text-main);border-radius:var(--r-sm);cursor:pointer;text-align:start;}
  .menu button svg{width:15px;height:15px;color:var(--text-sub);}
  .menu button:hover{background:var(--surface-2);}
  .menu button.danger{color:var(--pink);} .menu button.danger svg{color:var(--pink);}
  .menu .div{height:1px;background:var(--border);margin:5px 4px;}

  /* summary strip */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:20px;}
  .summary .cell{background:var(--surface);padding:14px 16px;}
  .summary .cell .k{font-size:11px;color:var(--text-sub);font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
  .summary .cell .k svg{width:13px;height:13px;color:var(--text-xs);}
  .summary .cell .v{font-family:var(--font-brand);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;}
  .summary .cell .v small{font-size:13px;font-weight:600;color:var(--text-sub);}
  .summary .cell .trend{font-size:10.5px;font-weight:700;margin-top:4px;}
  .trend.up{color:var(--green);} .trend.flat{color:var(--text-xs);}

  /* boardi guidance card (empty send state) */
  .guide{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,var(--surface-2),var(--surface));border:1px solid var(--border-mid);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:20px;}
  .guide .bo{width:76px;height:76px;flex-shrink:0;} .guide .bo svg{width:100%;height:100%;}
  .guide .gt{flex:1;min-width:0;}
  .guide .gt h3{font-family:var(--font-brand);font-weight:700;font-size:17px;margin-bottom:4px;}
  .guide .gt p{font-size:12.5px;color:var(--text-sub);line-height:1.5;max-width:440px;}
  .guide .btn{flex-shrink:0;}

  /* tabs (single row) */
  .tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--border);margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{position:relative;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--text-sub);background:none;border:none;cursor:pointer;font-family:var(--font-brand);display:flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;}
  .tab:hover{color:var(--text-main);}
  .tab.active{color:var(--cyan);font-weight:700;}
  .tab.active::after{content:'';position:absolute;inset-inline:0;bottom:-1.5px;height:2.5px;border-radius:3px;background:var(--cyan);}
  .tab .cnt{font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-sub);border-radius:20px;padding:1px 7px;min-width:20px;text-align:center;}
  .tab.active .cnt{background:rgba(56,196,242,.16);color:var(--cyan);}

  /* generic rows list */
  .rows{display:flex;flex-direction:column;gap:9px;}
  .item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 16px;transition:.15s;cursor:pointer;}
  .item:hover{border-color:var(--border-mid);box-shadow:var(--sh-sm);}
  .item .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .item .ic svg{width:19px;height:19px;}
  .ic.news{background:rgba(56,196,242,.13);color:var(--cyan);}
  .ic.series{background:rgba(37,62,122,.1);color:var(--navy);} [data-theme="dark"] .ic.series{color:#8aa9e8;}
  .item .imain{flex:1;min-width:0;}
  .item .iname{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-brand);}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;font-family:var(--font);}
  .tag.sent{color:var(--green);background:rgba(34,197,94,.12);}
  .tag.draft{color:var(--amber);background:rgba(245,158,11,.13);}
  .tag.sched{color:var(--cyan);background:rgba(56,196,242,.13);}
  .tag.on{color:var(--green);background:rgba(34,197,94,.12);}
  .item .isub{font-size:11.5px;color:var(--text-sub);margin-top:3px;}
  .stats{display:flex;gap:20px;flex-shrink:0;}
  .stat{text-align:center;}
  .stat .sv{font-family:var(--font-brand);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
  .stat .sk{font-size:10px;color:var(--text-xs);font-weight:600;}
  /* series toggle inline */
  .toggle{position:relative;width:40px;height:22px;border-radius:22px;background:var(--border-mid);cursor:pointer;transition:.2s;flex-shrink:0;border:none;}
  .toggle.on{background:var(--cyan);}
  .toggle::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
  .toggle.on::after{inset-inline-start:20px;}

  /* per-email row actions + multi-list badge */
  .item .rowacts{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .rowact{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-sub);cursor:pointer;transition:.15s;}
  .rowact:hover{border-color:var(--cyan);color:var(--cyan);background:var(--surface);}
  .rowact svg{width:16px;height:16px;}
  .lbadge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(37,62,122,.09);color:var(--navy);font-family:var(--font);}
  [data-theme="dark"] .lbadge{background:rgba(255,255,255,.08);color:#8aa9e8;}

  /* series timeline */
  .seq-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border-mid);border-radius:var(--r-md);}
  .seq-head .sh-t{font-family:var(--font-brand);font-weight:700;font-size:15px;}
  .seq-head .sh-sub{font-size:12px;color:var(--text-sub);margin-top:3px;}
  .seq{position:relative;}
  .seq-item{display:flex;gap:14px;position:relative;padding-bottom:14px;}
  .seq-item:last-child{padding-bottom:0;}
  .seq-line{position:absolute;inset-inline-start:19px;top:42px;bottom:-2px;width:2px;background:var(--border-mid);}
  .seq-item:last-child .seq-line{display:none;}
  .seq-num{width:40px;height:40px;border-radius:12px;background:var(--surface-3);color:var(--cyan);font-family:var(--font-brand);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;border:1px solid var(--border);}
  .seq-card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 15px;display:flex;align-items:center;gap:14px;}
  .seq-card .sc-main{flex:1;min-width:0;}
  .seq-card .sc-name{font-size:14px;font-weight:600;font-family:var(--font-brand);}
  .seq-card .sc-delay{font-size:11.5px;color:var(--text-sub);margin-top:3px;display:flex;align-items:center;gap:6px;}
  .seq-card .sc-delay svg{width:13px;height:13px;flex-shrink:0;}
  .seq-add{display:inline-flex;align-items:center;gap:7px;margin-top:14px;margin-inline-start:54px;background:none;border:1.5px dashed var(--border-mid);border-radius:var(--r-sm);padding:9px 15px;font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--text-sub);cursor:pointer;transition:.15s;}
  .seq-add:hover{border-color:var(--cyan);color:var(--cyan);}
  .seq-add svg{width:14px;height:14px;}

  /* empty tab (no items yet) */
  .tab-empty{text-align:center;padding:46px 20px;}
  .tab-empty .bo{width:88px;height:88px;margin:0 auto 14px;} .tab-empty .bo svg{width:100%;height:100%;}
  .tab-empty h3{font-family:var(--font-brand);font-weight:700;font-size:17px;margin-bottom:6px;}
  .tab-empty p{font-size:13px;color:var(--text-sub);max-width:360px;margin:0 auto 18px;line-height:1.55;}

  /* small tables for subscribers/sources */
  .mini{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
  .mini .mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;}
  .mini .mrow:last-child{border-bottom:none;}
  .mini .mrow.h{background:var(--surface-2);font-size:11px;font-weight:700;color:var(--text-sub);}
  .mini .mrow .grow{flex:1;min-width:0;}
  .mini .mrow .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
  .mini .mrow b{font-weight:700;} .mini .mrow .muted{color:var(--text-sub);font-size:12px;}
  .barmini{flex:1;height:7px;border-radius:6px;background:var(--surface-3);overflow:hidden;max-width:200px;}
  .barmini > span{display:block;height:100%;border-radius:6px;background:var(--cyan);}

  /* toasts */
  .toasts{position:fixed;bottom:22px;inset-inline-start:22px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border-mid);border-radius:var(--r-sm);padding:12px 15px;box-shadow:var(--sh-md);font-size:13px;font-weight:600;animation:tin .3s ease;}

      el.onclick=(function(id){return function(){state.sel=id;state.tab='emails';renderRail(document.getElementById('listSearch').value);renderContent();};})(l.id);
      el.innerHTML='<span class="dot '+l.status+'"></span><div class="body"><div class="nm">'+l.name+badge+'</div>'+
        '<div class="meta"><span class="n">'+fmt(l.subs)+'</span> נרשמים<span class="sep"></span>'+last+'</div></div>';

function renderSubs(l){
  if(!l.subscribers.length)return emptyTab('אין עדיין נרשמים','חבר טופס הרשמה או ייבא אנשי קשר כדי להתחיל לבנות את הרשימה.','הוספת נרשמים');
  var out='<div class="mini"><div class="mrow h"><span style="width:30px"></span><span class="grow">נרשם</span><span style="width:130px">מקור</span><span style="width:100px">נרשם ב־</span></div>';
  l.subscribers.forEach(function(s){out+='<div class="mrow"><span class="av">'+s.n.charAt(0)+'</span><span class="grow"><b>'+s.n+'</b><div class="muted">'+s.e+'</div></span><span style="width:130px" class="muted">'+s.src+'</span><span style="width:100px" class="muted">'+s.date+'</span></div>';});
  return out+'</div>';
}
function renderUnsub(l){
  if(!l.unsub.length)return emptyTab('אף אחד לא הסיר את עצמו','זה סימן טוב — כל הנרשמים עדיין איתך. כאן יופיעו נמענים שיבחרו לצאת מהרשימה.','');
  var out='<div class="mini"><div class="mrow h"><span style="width:30px"></span><span class="grow">נמען</span><span style="width:140px">סיבה</span><span style="width:100px">הוסר ב־</span></div>';
  l.unsub.forEach(function(s){out+='<div class="mrow"><span class="av" style="background:linear-gradient(135deg,var(--pink),var(--navy))">'+s.n.charAt(0)+'</span><span class="grow"><b>'+s.n+'</b><div class="muted">'+s.e+'</div></span><span style="width:140px" class="muted">'+s.reason+'</span><span style="width:100px" class="muted">'+s.date+'</span></div>';});
  return out+'</div>';
}
function renderSources(l){
  if(!l.sources.length)return emptyTab('אין עדיין נתוני מקורות','ברגע שאנשים יירשמו לרשימה, כאן תראה מאיפה הם הגיעו.','');
  var out='<div class="mini"><div class="mrow h"><span class="grow">מקור הרשמה</span><span style="flex:1;max-width:200px">התפלגות</span><span style="width:70px;text-align:start">נרשמים</span></div>';
  l.sources.forEach(function(s){out+='<div class="mrow"><span class="grow"><b>'+s.s+'</b></span><span class="barmini"><span style="width:'+s.p+'%"></span></span><span style="width:70px"><b>'+fmt(s.c)+'</b></span></div>';});
  return out+'</div>';
}
function emptyTab(h,p,cta){
  var b='<div class="tab-empty"><div class="bo"></div><h3>'+h+'</h3><p>'+p+'</p>'+(cta?'<button class="btn btn-primary" style="margin:0 auto" onclick="toast(\''+cta+'…\',\'info\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'+cta+'</button>':'')+'</div>';
  return b;
}

/* close menu on outside click */
document.addEventListener('click',function(){var m=document.getElementById('moreMenu');if(m)m.classList.remove('open');});

/* fill boardi into empty-tab placeholders after render */
var _rc=renderContent;
renderContent=function(){_rc();document.querySelectorAll('.tab-empty .bo:empty').forEach(function(e){e.appendChild(boardi());});};

/* init */
renderRail('');renderContent();
</script>
