<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>תודה! ההרשמה הושלמה — WHITEBOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#253E7A;--navy-dark:#1a2e5e;--cyan:#38C4F2;--pink:#F05680;--pink-strong:#e23e6b;
  --green:#7DC57A;--green-bright:#22c55e;--yellow:#EAD654;
  --bg:#EBF3FB;--surface:#FFFFFF;--surface-2:#F4F9FF;--surface-3:#edf4ff;
  --border:rgba(37,62,122,.1);--text-main:#1a2f5e;--text-sub:rgba(37,62,122,.52);--text-xs:rgba(37,62,122,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:
  radial-gradient(900px 500px at 85% -10%,rgba(56,196,242,.14),transparent 60%),
  radial-gradient(700px 460px at 10% 110%,rgba(240,86,128,.1),transparent 60%),var(--bg);
  color:var(--text-main);min-height:100dvh;display:grid;place-items:center;padding:28px 18px;overflow-x:hidden}
h1,h2,h3{font-family:'Fredoka'}
.card{position:relative;width:min(620px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:24px;box-shadow:0 34px 80px rgba(37,62,122,.16);padding:44px 40px 36px;text-align:center;z-index:2}
.logo{height:40px;margin-bottom:26px}
.boardi{width:120px;margin:0 auto 6px;display:block;filter:drop-shadow(0 14px 28px rgba(37,62,122,.18));
  animation:pop .8s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(30px)}to{opacity:1;transform:none}}
.check{width:52px;height:52px;border-radius:50%;background:var(--green-bright);display:grid;place-items:center;color:#fff;
  margin:-30px auto 14px;position:relative;border:4px solid var(--surface);box-shadow:0 10px 24px rgba(34,197,94,.35);
  animation:pop .7s cubic-bezier(.16,1,.3,1) .25s both}
.check svg{width:26px}
h1{font-size:clamp(26px,5vw,34px);font-weight:600;margin-bottom:8px}
.sub{font-size:16.5px;color:var(--text-sub);line-height:1.65;margin-bottom:24px}
.plan-box{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:18px 22px 16px;margin-bottom:22px;
  animation:rise .6s cubic-bezier(.16,1,.3,1) .4s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.plan-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.plan-name{font-family:'Fredoka';font-weight:600;font-size:21px}
.plan-badge{background:var(--pink);color:#fff;font-size:12px;font-weight:800;padding:4px 13px;border-radius:100px}
.plan-badge.free{background:var(--cyan)}
.plan-bill{font-size:13px;color:var(--text-sub)}
.perks{list-style:none;display:flex;flex-direction:column;gap:7px;text-align:right;max-width:400px;margin:0 auto}
.perks li{display:flex;align-items:center;gap:9px;font-size:14px}
.perks .ck{width:19px;height:19px;border-radius:50%;background:color-mix(in srgb,var(--green-bright) 16%,transparent);
  color:var(--green-bright);display:grid;place-items:center;flex-shrink:0}
.perks .ck svg{width:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;
  font-family:'Heebo';font-weight:700;border-radius:14px;transition:transform .2s,box-shadow .2s,background .2s}
.btn-primary{background:var(--pink);color:#fff;font-size:18px;padding:17px 40px;box-shadow:0 14px 34px rgba(240,86,128,.4);width:100%}
.btn-primary:hover{background:var(--pink-strong);transform:translateY(-2px);box-shadow:0 20px 44px rgba(240,86,128,.5)}
.btn-primary svg{width:20px}
.next{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.nx{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--text-sub);line-height:1.45}
.nx b{color:var(--text-main);font-size:12.5px}
.nx .ni{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}
.nx .ni svg{width:18px}
.ni-1{background:var(--cyan)}.ni-2{background:var(--navy)}.ni-3{background:var(--green)}
.help{margin-top:18px;font-size:12.5px;color:var(--text-xs)}
.help a{color:#1a86ad;font-weight:600;text-decoration:none}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1}
.cf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(660deg);opacity:.65}}
@media(max-width:560px){.card{padding:34px 22px 28px}.next{grid-template-columns:1fr;gap:10px}.nx{flex-direction:row;text-align:right}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.boardi,.check,.plan-box{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<main class="card">
  <img class="logo" src="assets/whiteboard-logo.png" alt="WHITEBOARD — Learn, Create, Grow">
  <img class="boardi" src="assets/boardi/2.svg" alt="בורדי חוגג">
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h1 id="ttl">תודה! ההרשמה הושלמה 🎉</h1>
  <p class="sub" id="sub">הכול מוכן. המערכת שלך מחכה — ובורדי כבר בפנים.</p>

  <div class="plan-box" id="planBox" hidden>
    <div class="plan-line">
      <span class="plan-name" id="planName"></span>
      <span class="plan-badge" id="planBadge" hidden></span>
      <span class="plan-bill" id="planBill"></span>
    </div>
    <ul class="perks" id="perks"></ul>
  </div>

  <a class="btn btn-primary" id="enterBtn" href="https://whiteboard.education/">
    כניסה למערכת
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  </a>

  <div class="next">
    <div class="nx"><span class="ni ni-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="m22 6-10 7L2 6"/></svg></span><span><b>מייל אישור</b><br>הקבלה ופרטי החשבון בדרך אליך</span></div>
    <div class="nx"><span class="ni ni-2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg></span><span><b>כניסה למערכת</b><br>עם המייל שאיתו נרשמת</span></div>
    <div class="nx"><span class="ni ni-3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M5 12H2M22 12h-3"/><rect x="6" y="6" width="12" height="12" rx="3"/><circle cx="9.5" cy="12" r="1"/><circle cx="14.5" cy="12" r="1"/></svg></span><span><b>בורדי מחכה בפנים</b><br>סיור היכרות אישי בכניסה הראשונה</span></div>
  </div>

  <p class="help">שאלות? אנחנו כאן — <a href="mailto:support@whiteboard.education">support@whiteboard.education</a></p>
</main>

<script>window.WB_FUNNEL_CONFIG={page:'thank_you'};</script>
<script src="assets/wb-funnel.js"></script>
<script>
(function(){
  var DEBUG=/[?&]wbdebug=1/.test(location.search);

  /* — plan catalog (exact live pricing) — */
  var PLANS={
    trial:     {name:'ניסיון',  price:0,   badge:'חינם לנצח', free:true,
                perks:['עד 100 תלמידים','3 קורסים','קהילה ומועדון']},
    teacher:   {name:'מורה',   price:149, badge:'30 יום חינם',
                perks:['עד 2,000 תלמידים','קורסים ללא הגבלה','CRM מובנה','0% עמלה על מכירות']},
    educator:  {name:'מחנך',   price:199, badge:'30 יום חינם',
                perks:['עד 25,000 תלמידים','בורדי — יצירת קורס עם AI','5 אתרי קורסים','משחקים ודומיין מותאם']},
    leader:    {name:'מנהיג',  price:399, badge:'30 יום חינם',
                perks:['עד 100,000 תלמידים','בורדי ללא הגבלה','WhiteBoard Studio + Live','אתרים ללא הגבלה']},
    enterprise:{name:'ארגוני', price:899, badge:'',
                perks:['תלמידים ללא הגבלה','SSO ארגוני','מנהל הצלחה ייעודי']}
  };

  /* — read the transaction from the URL —
     expected params from the payment flow:
     ?plan=teacher|educator|leader|enterprise|trial
     &billing=monthly|yearly   &value=1990   &txn=ABC123   (value/txn optional) */
  var qs=new URLSearchParams(location.search);
  var planKey=(qs.get('plan')||'').toLowerCase();
  var plan=PLANS[planKey]||null;
  var billing=(qs.get('billing')||'monthly').toLowerCase();
  var txn=qs.get('txn')||qs.get('transaction_id')||'';
  /* charge value: explicit param wins; else derived (yearly = pay 10 get 12) */
  var value=parseFloat(qs.get('value'))||
            (plan?(billing==='yearly'?plan.price*10:plan.price):0);

  /* — personalize the card — */
  if(plan){
    document.getElementById('planBox').hidden=false;
    document.getElementById('planName').textContent='מסלול '+plan.name;
    var badge=document.getElementById('planBadge');
    if(plan.badge){badge.hidden=false;badge.textContent=plan.badge;if(plan.free)badge.classList.add('free');}
    document.getElementById('planBill').textContent=
      plan.price===0?'':(billing==='yearly'?'חיוב שנתי · שילמת על 10 חודשים, קיבלת 12':'חיוב חודשי · ₪'+plan.price+' לחודש');
    var ul=document.getElementById('perks');
    plan.perks.forEach(function(t){
      var li=document.createElement('li');
      li.innerHTML='<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>';
      li.appendChild(document.createTextNode(t));
      ul.appendChild(li);
    });
    if(plan.free){
      document.getElementById('ttl').textContent='מעולה! החשבון שלך נפתח 🎉';
      document.getElementById('sub').textContent='מסלול הניסיון פעיל — בלי כרטיס אשראי, בלי הגבלת זמן.';
    }else if(planKey==='enterprise'){
      document.getElementById('ttl').textContent='תודה! קיבלנו את הפנייה 🎉';
      document.getElementById('sub').textContent='מנהל ההצלחה שלך יחזור אליך תוך יום עסקים לתיאום הקמה.';
    }
  }

  /* — funnel: thank-you viewed (step 8) — carries the verified plan/value/txn — */
  WBF.set({plan:planKey||undefined,billing:billing,value:value,currency:'ILS'});
  WBF.step('thankyou_viewed',{plan:planKey||'unknown',billing:billing,value:value,txn:txn});

  /* — the smart conversion event, fired ONCE per transaction —
     paid → purchase_completed (step 9; WBF maps it to Pixel Purchase w/ eventID for CAPI dedupe)
     trial → trial_started + Pixel StartTrial;  enterprise → lead_qualified + Pixel Lead */
  if(plan){
    var dedupeKey='wb_purch_'+(txn||planKey+'_'+billing);
    var already=false;try{already=!!localStorage.getItem(dedupeKey);}catch(e){}
    if(!already){
      try{localStorage.setItem(dedupeKey,'1');}catch(e){}
      var eventId=txn?'purch_'+txn:'purch_'+Date.now();
      if(plan.price===0){
        WBF.step('trial_started',{plan:planKey,value:0,transaction_id:txn});
        try{if(window.fbq)fbq('track','StartTrial',{value:0,currency:'ILS'},{eventID:eventId});}catch(e){}
      }else if(planKey==='enterprise'){
        WBF.step('lead_qualified',{plan:'enterprise',transaction_id:txn});
        try{if(window.fbq)fbq('track','Lead',{content_name:'enterprise'},{eventID:eventId});}catch(e){}
      }else{
        WBF.step('purchase_completed',{plan:planKey,plan_name:plan.name,billing:billing,
          value:value,currency:'ILS',transaction_id:txn},{eventID:eventId});
      }
    }else if(DEBUG)console.log('[WBF] conversion already reported for',dedupeKey);
  }

  /* — CTA into the system — */
  document.getElementById('enterBtn').addEventListener('click',function(){
    WBF.step('enter_system_clicked',{plan:planKey||'unknown'});
  });

  /* — confetti in brand colors — */
  if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    var colors=['#38C4F2','#F05680','#EAD654','#7DC57A','#253E7A'],host=document.getElementById('confetti');
    for(var i=0;i<70;i++){
      var s=document.createElement('i');s.className='cf';
      s.style.left=Math.random()*100+'vw';
      s.style.background=colors[i%colors.length];
      s.style.animationDuration=(2.6+Math.random()*2.6)+'s';
      s.style.animationDelay=(Math.random()*1.4)+'s';
      s.style.transform='rotate('+Math.random()*360+'deg)';
      host.appendChild(s);
    }
    setTimeout(function(){host.remove();},7000);
  }
})();
</script>
</body>
</html>
