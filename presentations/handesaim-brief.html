<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0B1220;color:#E7EEFB;font-family:-apple-system,'Heebo','Arial Hebrew',Arial,sans-serif;display:grid;place-items:center;padding:24px;direction:rtl}
.box{width:100%;max-width:430px;background:#131E35;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:30px 28px;box-shadow:0 28px 70px rgba(0,0,0,.45)}
img.logo{height:26px;width:auto;display:block;margin-bottom:22px;opacity:.9}
.kick{font-size:11px;font-weight:800;letter-spacing:.16em;color:#38C4F2;margin-bottom:8px}
h1{font-size:24px;font-weight:900;letter-spacing:-.01em;line-height:1.25;margin-bottom:8px}
p.sub{font-size:14px;line-height:1.6;color:rgba(231,238,251,.62);margin-bottom:20px}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:rgba(231,238,251,.45);margin-bottom:7px}
input{width:100%;font:inherit;font-size:19px;font-weight:700;letter-spacing:.22em;text-align:center;color:#fff;background:#0B1220;border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:14px;direction:ltr}
input:focus{outline:2px solid #38C4F2;outline-offset:1px}
button{width:100%;margin-top:12px;font:inherit;font-size:15px;font-weight:900;color:#0B1220;background:#38C4F2;border:none;border-radius:11px;padding:14px;cursor:pointer;min-height:48px}
button:hover{background:#5ad0f6}
button:disabled{opacity:.55;cursor:progress}
.msg{margin-top:13px;font-size:13px;line-height:1.5;min-height:19px}
.msg.err{color:#F05680;font-weight:700}
.msg.ok{color:#7DC57A;font-weight:700}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;line-height:1.6;color:rgba(231,238,251,.38)}
</style>

  var f=document.getElementById('f'), pw=document.getElementById('pw'),
      b=document.getElementById('b'), m=document.getElementById('m');
  function b64(s){var raw=atob(s),u=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);return u;}
  function say(t,c){m.textContent=t;m.className='msg'+(c?' '+c:'');}

    e.preventDefault();
