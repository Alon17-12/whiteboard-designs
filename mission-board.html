<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Board · WHITEBOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#253E7A;--navy-dark:#1a2e5e;--cyan:#38C4F2;--pink:#F05680;--green:#7DC57A;--yellow:#EAD654;
  --bg:#EBF3FB;--surface:#FFFFFF;--surface-2:#F4F9FF;--surface-3:#edf4ff;--border:rgba(37,62,122,0.1);
  --text-main:#1a2f5e;--text-sub:rgba(37,62,122,0.52);--text-xs:rgba(37,62,122,0.35);
  --r-xs:6px;--r-sm:10px;--r-md:16px;--r-lg:18px;--font:'Fredoka',sans-serif;--body:'Heebo',sans-serif;
}
[data-theme="dark"]{--bg:#0c1422;--surface:#131e35;--surface-2:#192740;--surface-3:#1e2e48;--border:rgba(255,255,255,.07);--text-main:#dde5f5;--text-sub:rgba(221,229,245,.52);--text-xs:rgba(221,229,245,.36)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text-main);height:100dvh;overflow:hidden;display:flex;font-size:13px;transition:.25s}
svg{stroke-linecap:round;stroke-linejoin:round}
.sidebar{width:220px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;padding:16px 12px;gap:4px}
.logo{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;color:#fff;font-family:var(--font);font-weight:700;font-size:16px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),#1db0d8);display:grid;place-items:center;color:#fff;font-weight:700}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.32);padding:8px 12px 2px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;cursor:pointer;transition:.15s;min-height:38px}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(56,196,242,.15);color:var(--cyan);font-weight:700}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item .bdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.nav-item .bc{margin-inline-start:auto;font-size:11px;color:rgba(255,255,255,.4);font-weight:700}
.side-bottom{margin-top:auto;display:flex;align-items:center;gap:9px;padding:8px 10px;color:rgba(255,255,255,.7)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pink),#d62a5e);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--text-sub);font-size:12.5px}
.crumb b{color:var(--text-main);font-family:var(--font);font-size:15px;font-weight:600}
.top-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-sub);display:grid;place-items:center;cursor:pointer;transition:.15s}
.icon-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.icon-btn svg{width:17px;height:17px}
.board-head{padding:12px 22px 8px;display:flex;flex-direction:column;gap:10px}
.btabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px}
.btab{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:30px;background:var(--surface);border:1px solid var(--border);color:var(--text-sub);font-weight:600;font-size:12.5px;cursor:pointer;transition:.15s}
.btab .bd{width:9px;height:9px;border-radius:50%}
.btab:hover{border-color:var(--cyan);color:var(--text-main)}
.btab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.btab .bcnt{background:rgba(37,62,122,.08);color:var(--text-sub);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700}
.btab.active .bcnt{background:rgba(255,255,255,.18);color:#fff}
.btab.add{border-style:dashed;color:var(--text-xs)}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filterbar .fsel{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 10px}
.filterbar select{border:none;background:transparent;font-family:var(--body);font-size:12px;color:var(--text-main);outline:none;font-weight:600;cursor:pointer;max-width:150px}
.filterbar .flabel{font-weight:700;font-size:10.5px;color:var(--text-xs);text-transform:uppercase;letter-spacing:.3px}
.filterbar .fclear{color:var(--pink);font-size:11.5px;font-weight:700;cursor:pointer}
.cmt{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.cmt .ch{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.cmt .ca{width:22px;height:22px;border-radius:50%;background:var(--cyan);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.cmt .cn{font-weight:700;font-size:12px}
.cmt .ct{font-size:10.5px;color:var(--text-xs);margin-inline-start:auto}
.cmt .cb{font-size:12.5px;line-height:1.5}
.cmt-send{display:flex;gap:6px;margin-top:6px}
.cmt-send button{border:none;background:var(--cyan);color:#fff;border-radius:9px;padding:0 16px;font-weight:700;cursor:pointer;font-family:var(--body)}
.upd-badge{display:inline-flex;align-items:center;gap:4px;color:var(--text-xs);font-size:10.5px;font-weight:700}
.board-title{display:flex;align-items:center;gap:10px}
.board-title .bt-dot{width:14px;height:14px;border-radius:5px}
.board-title h1{font-family:var(--font);font-size:20px;font-weight:600}
.board-title .cnt{color:var(--text-xs);font-weight:600;font-size:12px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:none;background:transparent;color:var(--text-sub);font-family:var(--body);font-weight:700;font-size:12px;padding:7px 13px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button.active{background:var(--surface);color:var(--navy);box-shadow:0 1px 4px rgba(37,62,122,.1)}
.seg button svg{width:15px;height:15px}
.search{position:relative;flex:1;min-width:160px;max-width:280px}
.search input{width:100%;font-family:var(--body);font-size:12.5px;padding:9px 34px 9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-main);outline:none;min-height:38px}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,196,242,.1)}
.search svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-xs)}
.tbtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);font-family:var(--body);font-weight:600;font-size:12px;cursor:pointer;min-height:38px}
.tbtn:hover{border-color:var(--cyan);color:var(--text-main)}
.tbtn svg{width:15px;height:15px}
.btn-primary{background:linear-gradient(135deg,var(--pink),#d62a5e);color:#fff;border:none;border-radius:30px;padding:9px 18px;font-family:var(--body);font-weight:700;font-size:12.5px;cursor:pointer;min-height:38px;display:flex;align-items:center;gap:6px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(240,86,128,.35)}
.btn-primary svg{width:15px;height:15px}
.board-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 22px 60px}
.group{margin-bottom:20px;width:max-content;min-width:100%}
.group-head{display:flex;align-items:center;gap:9px;padding:6px 4px;cursor:pointer;position:sticky;top:0;background:var(--bg);z-index:5}
.group-head .caret{width:16px;height:16px;color:var(--text-sub);transition:transform .2s}
.group.collapsed .caret{transform:rotate(-90deg)}
.group-head .gname{font-family:var(--font);font-weight:600;font-size:14px}
.group-head .gcount{color:var(--text-xs);font-size:11.5px;font-weight:600}
.gbar{width:5px;height:16px;border-radius:4px}
.table{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:clip;box-shadow:0 2px 8px rgba(37,62,122,.06);width:max-content;min-width:100%}
.group.collapsed .table,.group.collapsed .g-add{display:none}
.trow{display:flex;align-items:stretch;border-bottom:1px solid var(--border);min-height:42px}
.trow:last-child{border-bottom:none}
.trow.head{background:var(--surface-2);position:sticky;top:34px;z-index:4}
.cell{padding:7px 11px;display:flex;align-items:center;font-size:12.5px;border-left:1px solid var(--border);flex-shrink:0;position:relative}
.cell:last-child{border-left:none}
.cell.name{position:sticky;right:0;background:var(--surface);width:290px;gap:7px;font-weight:600;z-index:2}
.trow.head .cell.name{background:var(--surface-2)}
.trow.head .cell{color:var(--text-sub);font-weight:700;font-size:11.5px;gap:5px}
.trow:not(.head):hover{background:var(--surface-2)}
.trow:not(.head):hover .cell.name{background:var(--surface-2)}
.cw{width:150px}
.addcol{width:44px;justify-content:center;color:var(--text-xs);cursor:pointer}
.addcol:hover{color:var(--cyan)}
.colhead{cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.coltype{opacity:.5}
.expander{width:15px;height:15px;color:var(--text-xs);cursor:pointer;flex-shrink:0;transition:transform .15s}
.expander.open{transform:rotate(90deg)}
.item-name{cursor:pointer;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-name:hover{color:var(--cyan)}
.cellval{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.cellval.muted{color:var(--text-xs)}
.pill{padding:4px 9px;border-radius:6px;color:#fff;font-weight:600;font-size:11.5px;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:center;transition:filter .15s}
.pill:hover{filter:brightness(1.07)}
.pill.empty{background:var(--surface-3);color:var(--text-xs);border:1px dashed var(--border);min-width:60px}
.people{display:flex;cursor:pointer}
.ava{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:10px;border:2px solid var(--surface);margin-inline-start:-8px}
.people .ava:first-child{margin-inline-start:0}
.chip{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11.5px;color:var(--text-sub);font-weight:600;cursor:pointer}
.link-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(56,196,242,.1);color:var(--cyan);border-radius:6px;padding:4px 9px;font-weight:700;font-size:11.5px;text-decoration:none;cursor:pointer}
.link-btn svg{width:12px;height:12px}
.file-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(157,80,221,.12);color:#9d50dd;border-radius:6px;padding:4px 9px;font-weight:700;font-size:11.5px;text-decoration:none;cursor:pointer}
.file-btn svg{width:12px;height:12px}
.upd-auto{display:inline-flex;align-items:center;gap:5px;color:var(--text-sub);font-size:11.5px;font-weight:600}
.upd-auto svg{width:12px;height:12px;opacity:.6}
.popt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;margin:2px 0;font-size:12.5px;font-weight:600;color:var(--text-main)}
.popt:hover{background:var(--surface-2)}
.popt .pcheck{margin-inline-start:auto;color:var(--cyan);opacity:0}
.popt.on .pcheck{opacity:1}
.popt.on{background:var(--surface-2)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;padding:6px 4px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.swatch.on{border-color:var(--text-main)}
.menu-danger{border:none;background:rgba(223,47,74,.1);color:#df2f4a;border-radius:8px;padding:8px;font-weight:700;cursor:pointer;width:100%;margin-top:6px}
.menu-lbl{font-weight:700;color:var(--text-sub);font-size:11px;padding:2px 6px 5px}
.hamb{display:none}
.inledit{width:100%;border:1.5px solid var(--cyan);border-radius:7px;padding:5px 8px;font-family:var(--body);font-size:12.5px;background:var(--surface);color:var(--text-main);outline:none;box-shadow:0 0 0 3px rgba(56,196,242,.12)}
.g-add{padding:8px 14px;color:var(--text-xs);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.g-add:hover{color:var(--cyan)}
.subwrap{background:var(--surface-2);border-bottom:1px solid var(--border);padding:6px 10px 8px 34px}
.subrow{display:flex;align-items:center;gap:10px;min-height:34px;border-bottom:1px dashed var(--border);padding:1px 0}
.subrow:last-child{border:none}
.subrow .sname{width:250px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-h{font-size:10.5px;color:var(--text-xs);font-weight:700}
.sub-add{color:var(--text-xs);font-size:11px;cursor:pointer;padding-top:4px}
.sub-add:hover{color:var(--cyan)}
.newgroup{display:inline-flex;align-items:center;gap:6px;color:var(--text-xs);font-size:12.5px;cursor:pointer;padding:6px 4px;font-weight:600}
.newgroup:hover{color:var(--cyan)}
.kanban{display:flex;gap:14px;padding-bottom:10px;align-items:flex-start;min-width:min-content}
.kcol{width:265px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;max-height:100%}
.kcol-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.kcol-head .kdot{width:10px;height:10px;border-radius:3px}
.kcol-head .ktitle{font-family:var(--font);font-weight:600;font-size:13px}
.kcol-head .kcnt{color:var(--text-xs);font-size:11px;font-weight:700;margin-inline-start:auto}
.kcards{display:flex;flex-direction:column;gap:8px;overflow:auto}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;cursor:grab;box-shadow:0 1px 4px rgba(37,62,122,.06)}
.kcard:hover{border-color:var(--cyan)}
.kcard.drag{opacity:.4}
.kcard .kname{font-weight:600;font-size:12.5px;margin-bottom:8px;line-height:1.35}
.kcard .kmeta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kgroup-tag{font-size:10.5px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:430px;max-width:92vw;background:var(--surface);z-index:50;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.drawer-head h3{font-family:var(--font);font-weight:600;font-size:17px;line-height:1.3}
.drawer-body{padding:6px 20px 24px;overflow:auto;flex:1}
.field{padding:11px 0;border-bottom:1px solid var(--border)}
.field label{display:block;font-size:11px;color:var(--text-sub);font-weight:700;margin-bottom:6px}
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 44px rgba(10,20,40,.25);padding:8px;display:none;min-width:180px;max-height:320px;overflow:auto}
.menu.open{display:block;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.menu .opt{padding:8px 10px;border-radius:8px;color:#fff;font-weight:600;font-size:12px;cursor:pointer;margin:3px 0;text-align:center}
.menu .opt:hover{filter:brightness(1.09)}
.menu .mrow{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.menu input,.menu select{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:7px 9px;font-family:var(--body);font-size:12px;background:var(--surface);color:var(--text-main);outline:none}
.menu button{border:none;background:var(--cyan);color:#fff;border-radius:8px;padding:0 12px;font-weight:700;cursor:pointer}
.toasts{position:fixed;bottom:24px;left:24px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-right:4px solid var(--green);border-radius:12px;padding:11px 15px;box-shadow:0 12px 34px rgba(10,20,40,.2);font-weight:600;font-size:12.5px;animation:slideIn .3s ease}
.toast svg{width:17px;height:17px;color:var(--green)}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200;flex-direction:column;gap:14px;text-align:center}
.spin{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ===== UI polish ===== */
.cti{width:12px;height:12px;opacity:.5;flex-shrink:0;margin-inline-end:5px;vertical-align:-2px}
.pill,.chip,.link-btn,.file-btn,.btab,.tbtn,.btn-primary,.icon-btn,.kcard,.nav-item,.ava,.upd-badge{transition:transform .15s,box-shadow .15s,filter .15s,background .15s,border-color .15s,color .15s}
.pill{box-shadow:0 1px 2px rgba(37,62,122,.08)}
.chip:hover{border-color:var(--cyan);color:var(--text-main)}
.link-btn:hover,.file-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btab:hover{transform:translateY(-1px)}
.tbtn:hover{transform:translateY(-1px)}
.icon-btn:hover{transform:translateY(-1px)}
/* depth cue on the pinned first column */
.cell.name{box-shadow:-9px 0 14px -12px rgba(37,62,122,.5)}
[data-theme="dark"] .cell.name{box-shadow:-9px 0 16px -11px rgba(0,0,0,.65)}
/* group header */
.group-head{border-radius:9px;transition:background .12s}
.group-head:hover{background:var(--surface-2)}
.gcount{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 9px;line-height:1.6}
/* row hover accent bar on the pinned name cell */
.trow:not(.head) .cell.name{border-inline-start:3px solid transparent}
.trow:not(.head):hover .cell.name{border-inline-start-color:var(--cyan)}
/* kanban */
.kcol{border-top:3px solid var(--cyan)}
.kcard{border-inline-start:3px solid var(--border)}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,62,122,.14);border-color:var(--cyan)}
.kadd{margin-top:8px;padding:8px;border-radius:10px;border:1.5px dashed var(--border);color:var(--text-xs);font-size:11.5px;font-weight:700;text-align:center;cursor:pointer}
.kadd:hover{border-color:var(--cyan);color:var(--cyan)}
/* drawer */
.dr-sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px}
.dr-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--text-sub)}
.dr-chip .dc-dot{width:8px;height:8px;border-radius:50%}
.field label{text-transform:none;letter-spacing:0}
.cmt-send input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:9px;padding:8px 11px;font-family:var(--body);font-size:12.5px;background:var(--surface);color:var(--text-main);outline:none;transition:border-color .15s}
.cmt-send input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,196,242,.1)}
/* accessible focus */
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* ===== Council-v2 polish ===== */
/* row actions + menus */
.rowopt{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-main)}
.rowopt:hover{background:var(--surface-2)}
.rowmenu{opacity:0;cursor:pointer;color:var(--text-xs);flex-shrink:0;display:grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:800}
.trow:not(.head):hover .rowmenu{opacity:1}
.rowmenu:hover{background:var(--surface-3);color:var(--cyan)}
/* column header: sort primary, menu secondary */
.colhead{cursor:pointer}
.colmenu{opacity:0;cursor:pointer;color:var(--text-xs);font-weight:800;padding:0 4px;flex-shrink:0;font-size:15px;line-height:1}
.trow.head .cell:hover .colmenu{opacity:1}
.sortarrow{color:var(--cyan);font-size:10px;margin-inline-start:3px;font-weight:900}
/* due dates */
.due-over{background:rgba(240,86,128,.14)!important;color:var(--pink)!important;border:1px solid rgba(240,86,128,.35)!important;font-weight:700}
.due-today{background:rgba(234,214,84,.2)!important;color:#9a7d00!important;border:1px solid rgba(234,214,84,.55)!important;font-weight:700}
[data-theme="dark"] .due-today{color:#ecd94e!important}
/* group summary battery */
.gsummary{display:flex;align-items:center;gap:14px;padding:8px 12px;border-top:1px dashed var(--border);background:var(--surface-2);font-size:11px;color:var(--text-sub);flex-wrap:wrap}
.gs-count{font-weight:700}
.battery{display:flex;height:9px;width:190px;border-radius:6px;overflow:hidden;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--border)}
.battery span{height:100%}
.numsum b{color:var(--text-main)}
/* my-items chip */
.mine-chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:5px 12px;font-weight:700;font-size:12px;color:var(--text-sub);cursor:pointer}
.mine-chip:hover{border-color:var(--cyan);color:var(--text-main)}
.mine-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* empty person ghost avatar */
.ava-empty{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;border:1.5px dashed var(--border);color:var(--text-xs);font-size:14px;line-height:1}
/* undo toast button */
.toast-undo{margin-inline-start:12px;border:none;background:var(--navy);color:#fff;border-radius:8px;padding:5px 13px;font-weight:700;cursor:pointer;font-family:var(--body);font-size:12px}
.toast-undo:hover{background:var(--navy-dark)}
/* status popover selected marker + calmer blocks */
.menu .opt{padding:7px 10px;display:flex;align-items:center;justify-content:center;gap:6px}
.menu .opt.sel{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.menu .opt .osel{font-weight:900}
/* dark-mode pill calming */
[data-theme="dark"] .pill{filter:brightness(.86) saturate(.92)}
[data-theme="dark"] .menu .opt{filter:brightness(.9) saturate(.92)}
/* empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:44px 20px;text-align:center;color:var(--text-sub)}
.empty-state svg{width:66px;height:66px;color:var(--text-xs);opacity:.7}
.empty-state .es-title{font-family:var(--font);font-weight:600;font-size:15px;color:var(--text-main)}
.empty-state button{margin-top:4px}
/* drawer: action bar + two-column fields */
.dr-actions{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 12px;border-bottom:1px solid var(--border);margin-bottom:2px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field>label{margin:0;flex-shrink:0}
.field>div{text-align:left;min-width:0}
.field-full{display:block}
.field-full>label{margin-bottom:8px}
/* header row reads as header */
.trow.head{border-bottom:2px solid var(--border)}
/* sidebar count pill unified with tab count */
.nav-item .bc{background:rgba(255,255,255,.08);border-radius:20px;padding:1px 8px;min-width:22px;text-align:center}
/* desktop density */
@media(min-width:821px){.trow{min-height:36px}.cell{padding:5px 11px}}
/* multi-select */
.rowcheck{width:16px;height:16px;accent-color:var(--cyan);cursor:pointer;flex-shrink:0;opacity:0;transition:opacity .12s}
.trow:hover .rowcheck,.trow.head .rowcheck{opacity:1}
.rowcheck:checked{opacity:1}
.trow.sel{background:rgba(56,196,242,.07)}
.trow.sel .cell.name{border-inline-start-color:var(--cyan);background:rgba(56,196,242,.05)}
@media(max-width:820px){.rowcheck{opacity:.55}.rowmenu{opacity:.55}.colmenu{opacity:.55}}
.bulkbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:75;background:var(--navy);color:#fff;border-radius:14px;box-shadow:0 16px 44px rgba(10,20,40,.4);padding:8px 8px 8px 16px;display:none;align-items:center;gap:7px;max-width:94vw;flex-wrap:wrap}
.bulkbar.show{display:flex}
.bulkbar .bcount{font-weight:800;font-size:13px;margin-inline-end:2px}
.bulkbar button{border:none;background:rgba(255,255,255,.13);color:#fff;border-radius:9px;padding:8px 13px;font-weight:700;cursor:pointer;font-family:var(--body);font-size:12px}
.bulkbar button:hover{background:rgba(255,255,255,.24)}
.bulkbar button.del{background:rgba(240,86,128,.92)}
.bulkbar button.del:hover{background:var(--pink)}
.bulkbar .bclose{background:transparent;padding:6px 9px;font-size:14px}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.cal-title{font-family:var(--font);font-weight:600;font-size:16px}
.cal-nav{display:flex;gap:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-weight:700;font-size:11px;color:var(--text-sub);padding:2px 0 4px}
.cal-cell{min-height:98px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-cell.other{background:transparent;border:none}
.cal-cell.today{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(56,196,242,.22)}
.cal-daynum{font-size:11px;font-weight:700;color:var(--text-sub)}
.cal-cell.today .cal-daynum{color:var(--cyan)}
.cal-ev{font-size:10.5px;font-weight:600;color:#fff;border-radius:5px;padding:2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-more{font-size:10px;color:var(--text-xs);font-weight:700}
.cal-nodate{margin-top:16px;color:var(--text-sub);font-size:12px;font-weight:600}
@media(max-width:640px){.cal-cell{min-height:64px}.cal-ev{font-size:9px}}
/* reduced motion */
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ===== Responsive ===== */
@media (max-width:820px){
  .hamb{display:grid}
  .sidebar{position:fixed;top:0;bottom:0;right:0;z-index:70;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:-10px 0 40px rgba(10,20,40,.25)}
  body.nav-open .sidebar{transform:translateX(0)}
  .topbar{padding:0 14px}
  .crumb b{font-size:14px}
  .board-head{padding:10px 14px 6px}
  .board-scroll{padding:4px 14px 60px}
  .btabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}
  .btabs::-webkit-scrollbar{display:none}
  .btab{flex-shrink:0}
  .toolbar{gap:6px}
  .search{max-width:none;order:5;flex-basis:100%}
  .board-title h1{font-size:17px}
  .cell.name{width:170px}
  .toast,.toasts{left:12px;right:12px;bottom:12px}
  .drawer{width:100%;max-width:100%}
}
@media (max-width:480px){
  body{font-size:12.5px}
  .seg button{padding:7px 10px}
  .seg button span{display:none}
  .tbtn span{display:none}
  .cell.name{width:150px}
}
</style>
</head>

<script>
/* ================= State + persistence ================= */
const PALETTE=['#00c875','#38C4F2','#ff007f','#fdab3d','#9d50dd','#df2f4a','#579bfc','#7DC57A','#ff6d3b','#c4c4c4','#4eccc6','#9cd326'];
const LS='missionBoardState_v1';
let state=null, cur=null, view='table', collapsed={}, openSubs={};
let filters={group:'',prioCol:'',prioVal:'',person:'',sort:''};
const ME='אלון גבאי';
let TEAM=['אלון גבאי','Eyal Segal','achiad rechtman','yona shay']; // roster for the בעלים/person picker
const UPDATED_RE=/עודכן לאחרונה|עדכון אחרון|last[\s_]?updated|updated[\s_]?at/i;
const FILE_RE=/^זיפ$|zip|קובץ|attachment/i;
function heDate(ts){if(!ts)return'';const d=new Date(ts);return isNaN(d)?'':d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'})}

function uid(p){return p+Math.random().toString(36).slice(2,8)}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function normalize(raw){
  // raw = array of board objects from seed
  const boards={},order=[];
  raw.forEach((b,bi)=>{
    const key=b.key||('b'+bi);
    const board={key,name:b.name,color:b.color||PALETTE[bi%PALETTE.length],
      columns:(b.columns||[]).map(c=>({id:uid('c'),title:c.title,type:c.type})),
      subColumns:(b.subColumns||[]).map(c=>({id:uid('sc'),title:c.title,type:c.type})),
      groups:[],items:[]};
    const gmap={};
    (b.groups||[]).forEach(g=>{const gg={id:uid('g'),name:g.name,color:g.color||'#38C4F2'};board.groups.push(gg);gmap[g.name]=gg.id});
    (b.items||[]).forEach(it=>{
      let gid=gmap[it.group];
      if(!gid){const gg={id:uid('g'),name:it.group||'ללא קבוצה',color:'#c4c4c4'};board.groups.push(gg);gmap[gg.name]=gg.id;gid=gg.id}
      board.items.push({id:uid('i'),name:it.name,groupId:gid,cells:it.cells||{},
        subitems:(it.subitems||[]).map(s=>({id:uid('s'),name:s.name,cells:s.cells||{}}))});
    });
    if(!board.groups.length)board.groups.push({id:uid('g'),name:'כללי',color:'#38C4F2'});
    applySchema(board);
    boards[key]=board;order.push(key);
  });
  return {boards,order};
}
// Idempotent schema upgrade: special column semantics + seed updatedAt. Runs on fresh AND saved state (zero loss).
function parseHeDate(s){if(!s)return 0;const m=(''+s).match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]).getTime();const t=Date.parse(s);return isNaN(t)?0:t;}
function applySchema(b){
  (b.columns||[]).forEach(c=>{
    if(c.type==='date'&&UPDATED_RE.test(c.title))c.type='updated';
    else if(c.type==='link'&&FILE_RE.test(c.title))c.type='file';
  });
  const upCol=(b.columns||[]).find(c=>c.type==='updated');
  (b.items||[]).forEach(it=>{
    if(upCol&&!it.updatedAt){const seeded=parseHeDate(it.cells&&it.cells[upCol.title]);if(seeded)it.updatedAt=seeded;}
    // harvest real people into the roster
    (b.columns||[]).filter(c=>c.type==='person').forEach(c=>{const v=it.cells&&it.cells[c.title];if(v)(''+v).split(/[,،]/).forEach(n=>{n=n.trim();if(n&&!TEAM.includes(n))TEAM.push(n)})});
  });
}
function load(){
  const saved=localStorage.getItem(LS);

    try{
      state=JSON.parse(saved);
      // auto-absorb any NEW seed boards added after first load (e.g. the big 229 board), without losing edits
      const fresh=normalize((window.SEED||[]).filter(b=>!state.boards[b.key||'']));
      if(fresh.order.length){fresh.order.forEach(k=>{state.boards[k]=fresh.boards[k];state.order.push(k)});}
      // idempotent schema upgrade on already-saved boards (adds file/updated types + updatedAt, harvests roster) — no data loss
      state.order.forEach(k=>applySchema(state.boards[k]));
      syncRoster();save();
      return;
    }catch(e){}
  }
  state=normalize(window.SEED||[]);
  syncRoster();save();
}
// merge saved roster with harvested TEAM and keep them the same array ref so save() persists it

function avaColor(name){let h=0;for(let i=0;i<name.length;i++)h=name.charCodeAt(i)+((h<<5)-h);return PALETTE[Math.abs(h)%PALETTE.length]}

function esc(s){return (''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// escape a value going into a single-quoted JS arg inside a double-quoted on* attribute (handles ' \ " & < >)
function escA(s){return (''+s).replace(/[\\'"&<>]/g,c=>({'\\':'\\\\',"'":"\\'",'"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
// only allow safe URL schemes; block javascript:/data:, prefix schemeless
function safeUrl(u){u=(''+u).trim();if(!u)return '#';if(/^(https?:|mailto:)/i.test(u))return u;if(/^[a-z][a-z0-9+.\-]*:/i.test(u))return '#';return 'https://'+u.replace(/^\/+/,'')}

/* ================= Cell rendering ================= */
function renderCell(col,item,scope){
  const v=item.cells[col.title];
  const path=`'${item.id}','${escA(col.title)}','${scope||'item'}'`;
  switch(col.type){
    case 'status':
      if(v&&v.label)return `<span class="pill" style="background:${v.color||'#c4c4c4'};color:${pillText(v.color)}" onclick="openStatus(event,${path})">${esc(v.label)}</span>`;
      return `<span class="pill empty" onclick="openStatus(event,${path})">—</span>`;
    case 'person':return `<span onclick="openPeople(event,${path})" style="cursor:pointer">${personCell(v)}</span>`;
    case 'date':{if(!v)return `<span class="cellval muted" onclick="editText(event,${path},'date')">—</span>`;
      let cls='chip';const ts=parseHeDate(v);if(ts){const t0=new Date();t0.setHours(0,0,0,0);const d0=new Date(ts);d0.setHours(0,0,0,0);const diff=Math.round((d0-t0)/86400000);const sc=board().columns.find(c=>c.type==='status');const st=sc&&item.cells[sc.title];const done=st&&st.label&&/done|בוצע|הושלם|הסתיים|✓/i.test(st.label);if(!done&&diff<0)cls='chip due-over';else if(!done&&diff===0)cls='chip due-today';}
      return `<span class="${cls}" onclick="editText(event,${path},'date')">${esc(v)}</span>`;}
    case 'updated':{const ts=item.updatedAt;return ts?`<span class="upd-auto" title="מתעדכן אוטומטית"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>${esc(heDate(ts))}</span>`:`<span class="cellval muted">—</span>`;}
    case 'file':{const url=v&&(v.url||v);let t=(v&&v.text&&v.text!=='פתח')?v.text:'';
      if(!t&&url){try{const u=new URL(url);t=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||'')}catch(_){t=''}}
      t=t||'ZIP';if(t.length>22)t=t.slice(0,22)+'…';
      return url?`<a class="file-btn" href="${esc(safeUrl(url))}" target="_blank" rel="noopener" title="${esc(url)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M9 13h6M9 17h6"/></svg>${esc(t)}</a>`:`<span class="cellval muted" onclick="editText(event,${path})">＋ קובץ</span>`;}
    case 'link':{const url=v&&(v.url||v);let t=(v&&v.text&&v.text!=='פתח')?v.text:'';
      if(!t&&url){try{const u=new URL(url);t=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname)}catch(_){t='פתח'}}
      t=t||'פתח';if(t.length>24)t=t.slice(0,24)+'…';
      return url?`<a class="link-btn" href="${esc(safeUrl(url))}" target="_blank" rel="noopener" title="${esc(url)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>${esc(t)}</a>`:`<span class="cellval muted" onclick="editText(event,${path})">—</span>`;}
    case 'dropdown':return v?`<span class="chip" onclick="editText(event,${path})">${esc(v)}</span>`:`<span class="cellval muted" onclick="editText(event,${path})">—</span>`;
    default:return v?`<span class="cellval" onclick="editText(event,${path})">${esc(v)}</span>`:`<span class="cellval muted" onclick="editText(event,${path})">—</span>`;
  }
}

  if(filters.person){const pc=board().columns.find(c=>c.type==='person');const v=pc?it.cells[pc.title]:'';if(!(''+(v||'')).includes(filters.person))return false}

function sortItems(arr){
  if(filters.sort==='updated')return arr.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(filters.sort&&filters.sort.startsWith('date:')){const col=filters.sort.slice(5);return arr.slice().sort((a,b)=>{const da=a.cells[col]||'',db=b.cells[col]||'';return db>da?1:db<da?-1:0})}
  if(filters.sort&&filters.sort.startsWith('col:')){const col=filters.sort.slice(4);const dir=filters.sortDir||1;const c=board().columns.find(x=>x.title===col);
    const val=it=>{const v=it.cells[col];if(v==null||v==='')return c&&c.type==='number'?-Infinity:'';if(v.label!==undefined)return v.label;if(v.url!==undefined)return v.text||v.url;if(c&&c.type==='number')return parseFloat(v)||0;return ''+v};
    return arr.slice().sort((a,b)=>{const x=val(a),y=val(b);if(typeof x==='number'&&typeof y==='number')return (x-y)*dir;return (''+x).localeCompare(''+y,'he')*dir});}

function findItem(id){const b=board();let it=b.items.find(x=>x.id===id);if(it)return{it,parent:null};for(const p of b.items){const s=(p.subitems||[]).find(x=>x.id===id);if(s)return{it:s,parent:p}}return{it:null}}
function setCell(id,col,val){const{it}=findItem(id);if(!it)return;if(val===''||val==null)delete it.cells[col];else it.cells[col]=val;it.updatedAt=Date.now();save();render()}

/* ===== Undo (snapshot-based; no confirm dialogs) ===== */
let _undo=null;
function snapshot(){try{_undo=JSON.parse(JSON.stringify(state))}catch(e){_undo=null}}
function undo(){if(!_undo)return;state=_undo;_undo=null;if(!state.boards[cur])cur=state.order[0];save();renderNav();render();toast('הפעולה בוטלה')}
function toastUndo(msg){toast(msg,{label:'בטל',fn:undo})}

/* ===== Contrast: dark text on light pills ===== */
function pillText(bg){bg=(''+(bg||'#c4c4c4')).replace('#','');if(bg.length===3)bg=bg.split('').map(c=>c+c).join('');if(bg.length<6)return '#fff';const f=i=>parseInt(bg.slice(i,i+2),16)/255;const lin=x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);const L=.2126*lin(f(0))+.7152*lin(f(2))+.0722*lin(f(4));return L>.42?'#1a2f5e':'#fff'}

/* ===== Item lifecycle: rename / delete / duplicate / move ===== */
let pendingEditId=null,pendingEditGroup=null;
function renameItem(id,name){const{it}=findItem(id);if(!it)return;name=(''+name).trim();if(name){it.name=name;it.updatedAt=Date.now();save()}render();if(document.getElementById('drawer').classList.contains('open'))openDrawer(id)}
function deleteItem(id){const b=board();if(!b.items.some(x=>x.id===id))return;snapshot();b.items=b.items.filter(x=>x.id!==id);save();render();closeDrawer();toastUndo('הפריט נמחק')}
function deleteSubitem(id){snapshot();board().items.forEach(p=>{p.subitems=(p.subitems||[]).filter(s=>s.id!==id)});save();render();toastUndo('תת-המשימה נמחקה')}
function duplicateItem(id){const b=board();const idx=b.items.findIndex(x=>x.id===id);if(idx<0)return;const clone=JSON.parse(JSON.stringify(b.items[idx]));clone.id=uid('i');clone.name=(clone.name||'')+' (עותק)';clone.updatedAt=Date.now();(clone.subitems||[]).forEach(s=>s.id=uid('s'));b.items.splice(idx+1,0,clone);save();render();toast('הפריט שוכפל')}
function moveItem(id,gid){const{it}=findItem(id);if(!it)return;it.groupId=gid;it.updatedAt=Date.now();save();render();toast('הפריט הועבר')}

/* ===== Group summary battery ===== */
function groupSummary(items,b){
  const sc=b.columns.find(c=>c.type==='status');let bar='';
  if(sc&&items.length){const dist={};items.forEach(it=>{const v=it.cells[sc.title];const k=(v&&v.label)||'—';const col=(v&&v.color)||'var(--surface-3)';(dist[k]=dist[k]||{n:0,color:col}).n++});
    const total=items.length;bar=`<div class="battery" role="img" aria-label="התפלגות ${esc(sc.title)}">`+Object.keys(dist).map(k=>`<span style="width:${(dist[k].n/total*100).toFixed(1)}%;background:${dist[k].color}" title="${esc(k)}: ${dist[k].n}"></span>`).join('')+`</div>`;}
  const nums=b.columns.filter(c=>c.type==='number').map(c=>{const sum=items.reduce((a,it)=>a+(parseFloat(it.cells[c.title])||0),0);return `<span class="numsum">${esc(c.title)}: <b>${sum}</b></span>`}).join('');
  return `<div class="gsummary"><span class="gs-count">${items.length} פריטים</span>${bar}${nums}</div>`;
}

/* ===== Export / Import ===== */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function exportJSON(){dl(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'mission-board-backup.json');toast('גובה כ-JSON')}
function exportCSV(){const b=board();const cols=b.columns;const cellStr=v=>{if(v==null)return '';if(v.label!==undefined)return v.label;if(v.url!==undefined)return v.url;return ''+v};
  const rows=[['קבוצה','פריט',...cols.map(c=>c.title)]];
  b.groups.forEach(g=>b.items.filter(it=>it.groupId===g.id).forEach(it=>rows.push([g.name,it.name,...cols.map(c=>cellStr(it.cells[c.title]))])));
  const csv='﻿'+rows.map(r=>r.map(c=>`"${(''+c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  dl(new Blob([csv],{type:'text/csv'}),(b.name||'board')+'.csv');toast('יוצא כ-CSV')}
function importJSON(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d&&d.boards&&d.order){snapshot();state=d;cur=state.order[0];syncRoster();save();renderNav();render();toastUndo('הנתונים יובאו')}else toast('קובץ לא תקין')}catch(_){toast('שגיאה בקריאת הקובץ')}};rd.readAsText(f)};inp.click()}
function openExport(e){if(e&&e.stopPropagation)e.stopPropagation();closePop();
  pop.innerHTML=`<div class="menu-lbl">ייצוא / ייבוא</div>
    <div class="rowopt" onclick="exportJSON();closePop()">⬇ ייצוא JSON (גיבוי מלא)</div>
    <div class="rowopt" onclick="exportCSV();closePop()">⬇ ייצוא CSV (בורד נוכחי)</div>
    <div class="rowopt" onclick="importJSON();closePop()">⬆ ייבוא JSON</div>`;
  showPop(e);}

  cell.innerHTML='';cell.appendChild(inp);inp.focus();inp.select&&inp.select();
  const done=(commit)=>{
    if(commit){const nv=inp.value.trim();const b=board();const c=b.columns.find(x=>x.title===col)||b.subColumns.find(x=>x.title===col);

/* ===== Multi-select + bulk actions ===== */
let selected=new Set();
function toggleSelect(e,id){e.stopPropagation();if(selected.has(id))selected.delete(id);else selected.add(id);render()}
function toggleSelectGroup(e,gid){e.stopPropagation();const ids=board().items.filter(it=>it.groupId===gid).map(it=>it.id);const allSel=ids.length&&ids.every(id=>selected.has(id));ids.forEach(id=>allSel?selected.delete(id):selected.add(id));render()}
function clearSelect(){selected.clear();render()}
function renderBulkBar(){const bar=document.getElementById('bulkbar');const n=[...selected].filter(id=>board().items.some(x=>x.id===id)).length;
  if(!n){bar.className='bulkbar';bar.innerHTML='';return}
  bar.className='bulkbar show';
  bar.innerHTML=`<span class="bcount">${n} נבחרו</span>
    <button onclick="bulkStatus(event)">סטטוס</button>
    <button onclick="bulkAssign(event)">שיוך</button>
    <button onclick="bulkMove(event)">העבר</button>
    <button onclick="bulkDuplicate()">שכפל</button>
    <button class="del" onclick="bulkDelete()">מחק</button>
    <button class="bclose" onclick="clearSelect()" aria-label="בטל בחירה">✕</button>`;}
function bulkDelete(){if(!selected.size)return;snapshot();const n=selected.size;board().items=board().items.filter(x=>!selected.has(x.id));selected.clear();save();render();toastUndo(n+' פריטים נמחקו')}
function bulkDuplicate(){const b=board();const clones=[];b.items.forEach(it=>{if(selected.has(it.id)){const c=JSON.parse(JSON.stringify(it));c.id=uid('i');c.name=(c.name||'')+' (עותק)';c.updatedAt=Date.now();(c.subitems||[]).forEach(s=>s.id=uid('s'));clones.push(c)}});b.items.push(...clones);save();render();toast(clones.length+' פריטים שוכפלו')}
function bulkMove(e){e.stopPropagation();closePop();const b=board();pop.innerHTML=`<div class="menu-lbl">העבר לקבוצה</div>`+b.groups.map(g=>`<div class="rowopt" onclick="doBulkMove('${g.id}')"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${g.color}"></span>${esc(g.name)}</div>`).join('');showPop(e)}
function doBulkMove(gid){board().items.forEach(it=>{if(selected.has(it.id)){it.groupId=gid;it.updatedAt=Date.now()}});save();render();closePop();toast('הפריטים הועברו')}
function bulkStatus(e){e.stopPropagation();closePop();const sc=board().columns.find(c=>c.type==='status');if(!sc){toast('אין עמודת סטטוס בבורד');return}const labels=labelColorsFor(sc.title);
  pop.innerHTML=`<div class="menu-lbl">${esc(sc.title)}</div>`+Object.keys(labels).map(l=>`<div class="opt" style="background:${labels[l]};color:${pillText(labels[l])}" onclick="doBulkStatus('${escA(sc.title)}','${escA(l)}','${labels[l]}')">${esc(l)}</div>`).join('')+`<div class="opt" style="background:var(--surface-3);color:var(--text-sub)" onclick="doBulkStatus('${escA(sc.title)}','','')">נקה</div>`;showPop(e)}
function doBulkStatus(col,label,color){board().items.forEach(it=>{if(selected.has(it.id)){if(label)it.cells[col]={label,color};else delete it.cells[col];it.updatedAt=Date.now()}});save();render();closePop();toast('הסטטוס עודכן')}
function bulkAssign(e){e.stopPropagation();closePop();const pc=board().columns.find(c=>c.type==='person');if(!pc){toast('אין עמודת אנשים בבורד');return}
  pop.innerHTML=`<div class="menu-lbl">שייך את הנבחרים ל…</div>`+[...new Set(TEAM)].map(n=>`<div class="popt" onclick="doBulkAssign('${escA(pc.title)}','${escA(n)}')"><span class="ava" style="background:${avaColor(n)};margin:0">${esc(n[0]||'?')}</span>${esc(n)}</div>`).join('')+`<div class="popt" style="justify-content:center;color:var(--pink)" onclick="doBulkAssign('${escA(pc.title)}','')">נקה שיוך</div>`;showPop(e)}
function doBulkAssign(col,name){board().items.forEach(it=>{if(selected.has(it.id)){if(name)it.cells[col]=name;else delete it.cells[col];it.updatedAt=Date.now()}});save();render();closePop();toast(name?('שויך '+name):'השיוך נוקה')}

/* ===== Calendar view ===== */
let calRef=null;
function calDateCol(){const b=board();return b.columns.find(c=>c.type==='date'&&/תאריך יעד|יעד|due|deadline/i.test(c.title))||b.columns.find(c=>c.type==='date')}
function calNav(delta){const n=new Date();if(!calRef)calRef={y:n.getFullYear(),m:n.getMonth()};let m=calRef.m+delta,y=calRef.y;if(m<0){m=11;y--}if(m>11){m=0;y++}calRef={y,m};render()}
function calToday(){const n=new Date();calRef={y:n.getFullYear(),m:n.getMonth()};render()}
function renderCalendar(){
  const b=board(),dc=calDateCol();
  if(!dc)return `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><div class="es-title">אין עמודת תאריך בבורד</div><div>הוסף עמודת "תאריך" כדי לראות תצוגת לוח שנה</div></div>`;
  const now=new Date();if(!calRef)calRef={y:now.getFullYear(),m:now.getMonth()};
  const {y,m}=calRef;const first=new Date(y,m,1);const startDow=first.getDay();const dim=new Date(y,m+1,0).getDate();
  const q=(document.getElementById('search').value||'').trim();const byDay={};let undated=0;
  b.items.filter(it=>(!filters.group||it.groupId===filters.group)&&(!q||it.name.includes(q))&&passFilters(it)).forEach(it=>{const ts=parseHeDate(it.cells[dc.title]);if(!ts){undated++;return}const d=new Date(ts);if(d.getFullYear()===y&&d.getMonth()===m)(byDay[d.getDate()]=byDay[d.getDate()]||[]).push(it)});
  const dow=['א','ב','ג','ד','ה','ו','ש'];let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="cal-cell other"></div>`;
  for(let day=1;day<=dim;day++){const isToday=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===day;const evs=byDay[day]||[];
    const shown=evs.slice(0,3).map(it=>{const g=groupById(it.groupId);return `<div class="cal-ev" style="background:${g?g.color:'#38C4F2'}" onclick="openDrawer('${it.id}')" title="${esc(it.name)}">${esc(it.name)}</div>`}).join('');
    cells+=`<div class="cal-cell ${isToday?'today':''}"><div class="cal-daynum">${day}</div>${shown}${evs.length>3?`<div class="cal-more">+${evs.length-3} נוספים</div>`:''}</div>`;}
  return `<div class="cal">
    <div class="cal-head"><div class="cal-title">${esc(first.toLocaleDateString('he-IL',{month:'long',year:'numeric'}))} · ${esc(dc.title)}</div>
      <div class="cal-nav"><button class="tbtn" onclick="calNav(-1)">‹ קודם</button><button class="tbtn" onclick="calToday()">היום</button><button class="tbtn" onclick="calNav(1)">הבא ›</button></div></div>
    <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    ${undated?`<div class="cal-nodate">${undated} פריטים ללא ${esc(dc.title)} — לא מוצגים בלוח</div>`:''}
  </div>`;}
function addSub(itemId){const{it}=findItem(itemId);it.subitems=it.subitems||[];const s={id:uid('s'),name:'תת-משימה חדשה',cells:{}};it.subitems.push(s);openSubs[cur+itemId]=true;pendingEditId=s.id;save();render()}
function addGroup(){const b=board();const g={id:uid('g'),name:'קבוצה חדשה',color:PALETTE[b.groups.length%PALETTE.length]};b.groups.push(g);pendingEditGroup=g.id;save();render()}
function addBoard(){const key=uid('b');state.boards[key]={key,name:'בורד חדש',color:PALETTE[state.order.length%PALETTE.length],columns:[{id:uid('c'),title:'סטטוס',type:'status'},{id:uid('c'),title:'אחראי',type:'person'}],subColumns:[],groups:[{id:uid('g'),name:'כללי',color:'#38C4F2'}],items:[]};state.order.push(key);cur=key;save();renderNav();render();toast('בורד נוצר')}

/* drawer */
let _drawerTrigger=null;
function openDrawer(id){
  const{it}=findItem(id);if(!it)return;const b=board();const isTop=b.items.some(x=>x.id===id);
  if(!document.getElementById('drawer').classList.contains('open'))_drawerTrigger=document.activeElement;
  const drT=document.getElementById('drTitle');drT.textContent=it.name;drT.title='לחיצה כפולה לשינוי שם';drT.ondblclick=()=>editDrawerTitle(id);
  const g=groupById(it.groupId);const sub=[];
  if(g)sub.push(`<span class="dr-chip"><span class="dc-dot" style="background:${g.color}"></span>${esc(g.name)}</span>`);
  sub.push(`<span class="dr-chip"><span class="dc-dot" style="background:${b.color}"></span>${esc(b.name)}</span>`);
  if(it.updatedAt)sub.push(`<span class="dr-chip">עודכן ${esc(heDate(it.updatedAt))}</span>`);
  document.getElementById('drSub').innerHTML=sub.join('');
  const cols=isTop?b.columns:(b.subColumns.length?b.subColumns:[{title:'סטטוס',type:'status'},{title:'אחראי',type:'person'}]);
  const upd=it.updates||[];
  const actions=`<div class="dr-actions">
      <button class="tbtn" onclick="editDrawerTitle('${id}')"><svg viewBox="0 0 24 24" width="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> שנה שם</button>
      ${isTop?`<button class="tbtn" onclick="duplicateItem('${id}')"><svg viewBox="0 0 24 24" width="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> שכפל</button>`:''}
      <button class="tbtn" style="color:var(--pink);border-color:rgba(240,86,128,.3)" onclick="${isTop?`deleteItem('${id}')`:`deleteSubitem('${id}')`}"><svg viewBox="0 0 24 24" width="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> מחק</button>
    </div>`;
  document.getElementById('drBody').innerHTML=actions+cols.map(c=>`<div class="field"><label>${esc(c.title)}</label><div data-cell="${id}|${esc(c.title)}">${renderCell(c,it)}</div></div>`).join('')
    +`<div class="field field-full"><label>עדכונים ותגובות (${upd.length})</label>
        <div id="cmtList">${upd.map(u=>`<div class="cmt"><div class="ch"><span class="ca">${esc((u.by||'?')[0]||'?')}</span><span class="cn">${esc(u.by||'')}</span><span class="ct">${fmtTime(u.at)}</span></div><div class="cb">${esc(u.text).replace(/\\n/g,'<br>')}</div></div>`).join('')||`<div class="empty-state" style="padding:20px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div>אין עדכונים עדיין — כתוב את הראשון</div></div>`}</div>
        <div class="cmt-send"><input id="cmtInput" aria-label="כתוב עדכון" placeholder="כתוב עדכון..." onkeydown="if(event.key==='Enter')addComment('${id}')"><button onclick="addComment('${id}')">שלח</button></div>
      </div>`;
  document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('open');
  setTimeout(()=>{const c=document.getElementById('drClose');if(c)c.focus();},60);
}
function editDrawerTitle(id){const drT=document.getElementById('drTitle');drT.contentEditable='true';drT.focus();
  const r=document.createRange();r.selectNodeContents(drT);const s=getSelection();s.removeAllRanges();s.addRange(r);
  const finish=(commit)=>{drT.contentEditable='false';drT.onblur=null;drT.onkeydown=null;if(commit)renameItem(id,drT.textContent);};
  drT.onblur=()=>finish(true);
  drT.onkeydown=(ev)=>{if(ev.key==='Enter'){ev.preventDefault();drT.blur()}if(ev.key==='Escape'){ev.stopPropagation();drT.textContent=(findItem(id).it||{}).name||'';drT.blur()}};
}
function closeDrawer(){const d=document.getElementById('drawer');if(!d.classList.contains('open'))return;d.classList.remove('open');document.getElementById('scrim').classList.remove('open');if(_drawerTrigger&&_drawerTrigger.focus){try{_drawerTrigger.focus()}catch(e){}}_drawerTrigger=null}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
function addComment(id){const inp=document.getElementById('cmtInput');const t=(inp.value||'').trim();if(!t)return;const{it}=findItem(id);it.updates=it.updates||[];it.updates.push({text:t,by:ME,at:Date.now()});it.updatedAt=Date.now();save();openDrawer(id);render();toast('עדכון נוסף')}

/* kanban dnd */
let dragId=null;
function drag(e,id){dragId=id;e.target.classList.add('drag')}
function drop(e,label,col){e.preventDefault();document.querySelectorAll('.kcard').forEach(c=>c.classList.remove('drag'));
  if(label==='— ריק —')setCell(dragId,col,null);else{const color=labelColorsFor(col)[label]||nextColor(col);setCell(dragId,col,{label,color})}toast('הכרטיס עודכן')}

/* theme + toast */
document.getElementById('themeBtn').onclick=()=>{const h=document.documentElement;const d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');
  document.getElementById('themeBtn').setAttribute('aria-pressed',(!d).toString());
  document.getElementById('themeIcon').outerHTML=d?`<svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`:`<svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>`};
// Escape closes popover first, then drawer
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(pop.classList.contains('open')){closePop();}else if(document.getElementById('drawer').classList.contains('open')){closeDrawer();}}});
function toast(msg,action){const t=document.createElement('div');t.className='toast';t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg><span>${esc(msg)}</span>`;
  if(action){const btn=document.createElement('button');btn.className='toast-undo';btn.textContent=action.label;btn.onclick=()=>{action.fn();t.remove()};t.appendChild(btn)}
  document.getElementById('toasts').appendChild(t);const dur=action?5200:2600;setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-30px)';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},dur)}

/* boot */
function boot(){renderNav();render();document.getElementById('loading').style.display='none'}
function start(){
  if(!window.SEED||!window.SEED.length){document.getElementById('loading').innerHTML='<div style="color:var(--text-sub);max-width:400px;text-align:center;line-height:1.7">קובץ הנתונים <b>seed.js</b> עדיין לא נוצר.<br>הרץ את שלב הייבוא, ואז רענן.</div>';return}
  load();cur=cur||state.order[0];boot();
}
start();
</script>
</body>
</html>
